[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topological-alpha"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn"]

[project.optional-dependencies]
mapper = ["kmapper", "umap-learn"]
dev = ["pytest", "ruff", "mypy", "lean"]
docs = ["matplotlib", "networkx"]

# nothing to package: the strategy is deployed as LEAN project files
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["TopologicalAlpha"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# AlgorithmImports is a star import by design in LEAN
ignore = ["F403", "F405"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topological-alpha"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn"]

[project.optional-dependencies]
mapper = ["kmapper", "umap-learn"]
dev = ["pytest", "ruff", "mypy", "lean"]
docs = ["matplotlib", "networkx"]

# nothing to package: the strategy is deployed as LEAN project files
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["TopologicalAlpha"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# AlgorithmImports is a star import by design in LEAN
ignore = ["F403", "F405"]

# Strict settings for the single-file build (dist/main.py), matching QC's editor warnings.
# umap-learn ships py.typed since 0.6.0 but leaves UMAP() unannotated, so exempt its calls.
[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
untyped_calls_exclude = ["umap"]
